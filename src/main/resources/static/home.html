<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .navbar {
            background-color: #222;
            padding: 15px 30px;
            color: white;
        }

        .navbar h2 {
            margin: 0;
        }

        .container {
            text-align: center;
            margin-top: 100px;
        }

        .container h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .container p {
            font-size: 18px;
            color: #555;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #444;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <h2>My Application</h2>
</nav>

<main class="container">
    <h1>Welcome to My Application</h1>

    <p>
        This is the home page of my Spring Boot application.
    </p>

    <a href="/login" class="btn">
        Login
    </a>
</main>

</body>
</html>
